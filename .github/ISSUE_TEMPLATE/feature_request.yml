name: Feature request
description: Suggest something Keyboard Lock should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you running into?
      description: Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This keeps the app a single-purpose keyboard lock rather than a general utility suite.
          required: false
