name: Translation
description: Add or fix a language
labels: [i18n]
body:
  - type: markdown
    attributes:
      value: |
        See [docs/TRANSLATING.md](../../docs/TRANSLATING.md) for the whole
        process. A pull request is very welcome — the test suite tells you if
        anything is missing.

  - type: input
    id: locale
    attributes:
      label: Language / locale code
      placeholder: 'Swedish (sv)'
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: What needs adding or fixing?
    validations:
      required: true
